name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.58.0"

      - name: Install CSharpier
        run: dotnet tool install -g csharpier --version 1.3.0

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45.0

      - name: Install pandoc (pinned for Markdown lint/format)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc-3.1.3-1-amd64.deb
          pandoc --version | head -1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: just build

      - name: Lint
        run: just lint

      - name: Test
        run: just test
